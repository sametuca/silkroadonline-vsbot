name: Build Windows executable

# Builds a single-file Windows .exe with PyInstaller so players never need
# Python or git - just a download link. Runs on every push to main (as a
# downloadable build artifact) and, when a tag like "v1.0.0" is pushed,
# also attaches the exe to a GitHub Release.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SilkroadVisionBot --add-data "assets;assets" main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilkroadVisionBot-windows
          path: dist/SilkroadVisionBot.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SilkroadVisionBot.exe
