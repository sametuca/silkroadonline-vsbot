name: Build Windows executable

# Builds a single-file Windows .exe with PyInstaller so players never need
# Python or git - just a download link. Every push to main updates a single
# rolling "latest" GitHub Release with the newest build - no manual tagging
# needed. (Also runnable by hand from the Actions tab.)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SilkroadVisionBot --add-data "assets;assets" main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilkroadVisionBot-windows
          path: dist/SilkroadVisionBot.exe

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatically rebuilt from the latest commit on `main`
            (${{ github.sha }}). Always the newest version - just download
            `SilkroadVisionBot.exe` below and run it.
          files: dist/SilkroadVisionBot.exe
