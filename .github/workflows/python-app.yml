# Lint + tests. Runs on Windows because the bot talks to the Win32 API (ctypes.windll)
# at import time, so the engine tests can't load on Linux.

name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Lint
        run: ruff check srbot tests main.py --select E9,F63,F7,F82,F401,F841

      - name: Test
        run: pytest
